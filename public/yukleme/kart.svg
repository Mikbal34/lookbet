  <style type="text/css">@keyframes keyCardTap {
  0%, 100% {
    transform: translate(0px, 0px) rotate(0deg);
  }
  15% {
    transform: translate(-3px, -2px) rotate(-2deg);
  }
  40% {
    transform: translate(9px, 3.2px) rotate(3.5deg);
  }
  48% {
    transform: translate(8.6px, 3px) rotate(3deg);
  }
  75% {
    transform: translate(0px, 0px) rotate(0deg);
  }
}
@keyframes ledBlink {
  0%, 38% {
    opacity: 0.5;
    transform: scale(1);
    filter: none;
  }
  41% {
    opacity: 1;
    transform: scale(1.3);
    filter: drop-shadow(0 0 3px #fc7926);
  }
  45% {
    opacity: 0.35;
    transform: scale(0.95);
    filter: none;
  }
  49% {
    opacity: 1;
    transform: scale(1.35);
    filter: drop-shadow(0 0 4px #fc7926);
  }
  56% {
    opacity: 0.5;
    transform: scale(1);
    filter: none;
  }
  100% {
    opacity: 0.5;
    transform: scale(1);
    filter: none;
  }
}
@keyframes shadowPulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.5;
  }
  15% {
    transform: scale(0.92);
    opacity: 0.4;
  }
  40%, 48% {
    transform: scale(1.1) translate(2.5px, 0);
    opacity: 0.7;
  }
  75% {
    transform: scale(1);
    opacity: 0.5;
  }
}
@keyframes rippleRing {
  0%, 39% {
    r: 2px;
    opacity: 0;
    stroke-width: 1.5px;
  }
  41% {
    opacity: 0.85;
    stroke-width: 1.2px;
  }
  56% {
    r: 8.5px;
    opacity: 0;
    stroke-width: 0.2px;
  }
  100% {
    opacity: 0;
    r: 2px;
  }
}
.anim-key-card {
  transform-origin: 30px 40px;
  animation: keyCardTap 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.anim-indicator-led {
  transform-origin: 49.01px 54.3px;
  animation: ledBlink 2.4s ease-in-out infinite;
}
.anim-floor-shadow {
  transform-origin: 36.2px 67.47px;
  animation: shadowPulse 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.anim-ripple {
  animation: rippleRing 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  
