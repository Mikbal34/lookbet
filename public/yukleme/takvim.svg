  <style type="text/css">@keyframes page-flip {
  0%, 10% {
    transform: translate(0, 0) rotate(0deg) scale(1, 1);
    opacity: 1;
    transform-origin: 42px 16px;
  }
  26% {
    transform: translate(-1px, -4px) rotate(-3deg) scale(0.92, 0.62) skewX(-8deg);
    opacity: 1;
    transform-origin: 42px 16px;
  }
  42% {
    transform: translate(-3px, -13px) rotate(-7deg) scale(0.82, -0.38) skewX(-11deg);
    opacity: 0.85;
    transform-origin: 42px 16px;
  }
  50% {
    transform: translate(-4px, -18px) rotate(-11deg) scale(0.72, -0.75) skewX(-14deg);
    opacity: 0;
    transform-origin: 42px 16px;
  }
  88% {
    transform: translate(0, 0) rotate(0deg) scale(1, 1);
    opacity: 0;
    transform-origin: 42px 16px;
  }
  98%, 100% {
    transform: translate(0, 0) rotate(0deg) scale(1, 1);
    opacity: 1;
    transform-origin: 42px 16px;
  }
}
@keyframes marker-pop {
  0%, 14% {
    transform: scale(1);
    opacity: 1;
    transform-origin: 61px 39px;
  }
  25% {
    transform: scale(0.6) translateY(-4px);
    opacity: 0;
    transform-origin: 61px 39px;
  }
  50% {
    transform: scale(0);
    opacity: 0;
    transform-origin: 61px 39px;
  }
  65% {
    transform: scale(1.22);
    opacity: 1;
    transform-origin: 61px 39px;
  }
  75% {
    transform: scale(0.92);
    opacity: 1;
    transform-origin: 61px 39px;
  }
  84%, 100% {
    transform: scale(1);
    opacity: 1;
    transform-origin: 61px 39px;
  }
}
@keyframes stack-cushion {
  0%, 14% {
    transform: translateY(0);
    transform-origin: 40px 40px;
  }
  30% {
    transform: translateY(0.35px);
    transform-origin: 40px 40px;
  }
  48% {
    transform: translateY(-0.55px) scale(1.008);
    transform-origin: 40px 40px;
  }
  60% {
    transform: translateY(0.2px) scale(0.998);
    transform-origin: 40px 40px;
  }
  72%, 100% {
    transform: translateY(0) scale(1);
    transform-origin: 40px 40px;
  }
}
.anim-front-page {
  animation: page-flip 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.anim-marker {
  animation: marker-pop 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}
.anim-stack {
  animation: stack-cushion 1.8s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
