# /etc/nginx/conf.d/lookbet.conf (deploy.sh kopyalar). http bağlamında.

# Cloudflare arkasında gerçek ziyaretçi IP'si: yalnız Cloudflare'in kendi
# aralıklarından gelen bağlantıda CF-Connecting-IP'ye güvenilir (başkası bu
# başlığı yazsa da geçmez). Böylece $remote_addr — hız sınırları ve uygulamaya
# giden X-Real-IP — ziyaretçinin IP'si olur. Liste: cloudflare.com/ips (2026-09-26).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# İstek hızı sınırları, IP başına. Uygulamanın kendi sınırları da var (giriş
# kodu e-posta başına, kupon kullanıcı başına); bu katman kaba kuvveti ve
# tedarikçiye giden aramaların kötüye kullanımını keser.
limit_req_zone $binary_remote_addr zone=lb_giris:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lb_arama:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lb_api:10m rate=10r/s;
limit_req_status 429;

# WebSocket (geliştirme dışında yok) yalnız Upgrade isteyende; diğer isteklerde
# Connection boş kalır ki upstream keepalive çalışsın.
map $http_upgrade $lb_baglanti {
    default upgrade;
    ""      "";
}

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # SSL hazırlığı — domain gelince aşağıdaki satırları aç:
    # listen 443 ssl;
    # server_name yourdomain.com;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip compression. application/x-ndjson (akışlı otel araması) bilerek
    # yok: sıkıştırma tamponu ilk sonuçları geciktirebilir.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Güvenlik başlıkları. Konum bloklarında add_header KULLANMAYIN: nginx o
    # blokta sunucu düzeyindekileri miras almaz (önbellek için `expires`).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    # İçerik güvenlik politikası: betik yalnız sitenin kendisinden ve Google
    # Maps'ten; çerçeveleme ve eklenti yok. Next.js satır içi betik kullandığı
    # için 'unsafe-inline' gerekli (nonce'a geçilirse kaldırılabilir).
    # HTTPS gelince "upgrade-insecure-requests" eklenmeli.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://appleid.apple.com; frame-ancestors 'self'" always;

    # Uygulamaya giden istek başlıkları (konumlar miras alır).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $lb_baglanti;
    proxy_set_header Host $host;
    # Uygulama hız sınırında istemci IP'si olarak bunu kullanıyor; istemcinin
    # gönderdiği değer burada eziliyor.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    client_max_body_size 2M;

    # Next'in kendi Cache-Control'ü (immutable) geçer.
    location /_next/static/ {
        proxy_pass http://nextjs;
    }

    # Nesne illüstrasyonları, bekleme animasyonları: dosya adı sabit, içerik
    # nadiren değişir — bir hafta önbellek.
    location ~ ^/(nesne|yukleme)/ {
        proxy_pass http://nextjs;
        proxy_hide_header Cache-Control;
        expires 7d;
    }

    # Zamanlanmış içerik işleri yalnızca sunucunun kendisinden (cron →
    # 127.0.0.1:3000). Dışarıya kapalı; uç ayrıca CRON_SECRET istiyor.
    location /api/internal/ {
        return 404;
    }

    # Giriş kodu isteme ve doğrulama: dakikada 10 (5 ani fazlalık).
    location ~ ^/api/auth/(otp/|callback/) {
        limit_req zone=lb_giris burst=5 nodelay;
        proxy_pass http://nextjs;
    }

    # Otel ve oda araması (Etscore'a gider): dakikada 30 (20 ani fazlalık).
    # Otel araması akış (ndjson) döner; tamponlama kapalı.
    location ~ ^/api/(hotels|rooms)/search {
        limit_req zone=lb_arama burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://nextjs;
    }

    # Rezervasyon Etscore'da 90 sn'ye kadar sürebiliyor.
    location /api/booking {
        limit_req zone=lb_api burst=10 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://nextjs;
    }

    location /api/ {
        limit_req zone=lb_api burst=40 nodelay;
        proxy_pass http://nextjs;
    }

    # Let's Encrypt challenge (domain gelince)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://nextjs;
    }
}
